<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Chaussons Cozy Dragon assortis™ – Cozy Dragon</title>
  <meta name="description" content="Les chaussons assortis au Dragon Onesie™ : polaire ultra-douce, semelle antidérapante.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23f3efe4'/%3E%3Cpath fill='%230f3d2e' d='M33 56 C30 50 29 44 31 40 L24 24 C29 29 34 32 37 35 L36 17 C40 23 44 27 47 28 C54 26 62 27 69 31 C74 34 77 37 79 40 L74 43 L62 44 L71 48 C68 53 61 55 54 56 C47 57 39 58 33 56 Z'/%3E%3Cellipse cx='58' cy='35' rx='4.6' ry='2.7' fill='%23f3efe4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="simple-product" data-product="slippers">

  <a class="skip-link" href="#main">Aller au contenu</a>

  <!-- Bandeau démo (16 px, très discret) -->
  <div class="demo-strip" data-demo-strip>Démo interne — images de référence, non commercial</div>

  <!-- Barre d'annonce défilante (texte dans product.json → announcement) -->
  <div class="announce" id="announce" role="region" aria-label="Annonce"><div class="announce__track" id="announce-track"></div></div>

  <!-- En-tête : ordre mobile = burger, loupe, logo centré, compte, panier ;
       ordre desktop (CSS order) = logo, nav, EUR ▾, loupe, compte, panier -->
  <header class="header" id="top">
    <div class="container header__inner">
      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false" data-icon="menu"></button>
      <button type="button" class="icon-btn search-btn" id="search-btn" aria-label="Rechercher" data-icon="search"></button>
      <a class="logo" href="./index.html" aria-label="Cozy Dragon – Accueil">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cozy Dragon">
          <circle cx="50" cy="50" r="50" fill="#f3efe4"/>
          <circle cx="50" cy="50" r="46" fill="none" stroke="#0f3d2e" stroke-width="1.4"/>
          <path fill="#0f3d2e" d="M33 56 C30 50 29 44 31 40 L24 24 C29 29 34 32 37 35 L36 17 C40 23 44 27 47 28 C54 26 62 27 69 31 C74 34 77 37 79 40 L74 43 L62 44 L71 48 C68 53 61 55 54 56 C47 57 39 58 33 56 Z"/>
          <ellipse cx="58" cy="35" rx="4.6" ry="2.7" fill="#f3efe4" transform="rotate(-10 58 35)"/>
          <ellipse cx="58.6" cy="35" rx="1.1" ry="2.2" fill="#0f3d2e" transform="rotate(-10 58.6 35)"/>
          <circle cx="74" cy="38.5" r="0.9" fill="#f3efe4"/>
          <text x="50" y="69.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.4" fill="#0f3d2e">COZY</text>
          <text x="50" y="81.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.1" fill="#0f3d2e">DRAGON</text>
        </svg>
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="./index.html">Accueil</a>
        <a href="./contact.html">Contact</a>
      </nav>
      <button type="button" class="currency" id="currency-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Pays et devise"><span data-currency-label>EUR €</span> <span data-icon="chevron-down"></span></button>
      <a class="icon-btn account-btn" href="./connexion.html" aria-label="Compte" data-icon="user"></a>
      <button type="button" class="icon-btn cart-btn" id="cart-btn" aria-label="Ouvrir le panier"><span data-icon="cart"></span><span class="cart-count" data-cart-count hidden>0</span></button>
    </div>
  </header>

  <main id="main">
    <p id="load-error" class="notice container" hidden></p>

    <section class="product container" aria-labelledby="sp-name">
      <div class="product__grid">

      <div class="gallery" id="sp-gallery" aria-roledescription="carrousel" aria-label="Photos du produit">
        <div class="gallery__frame">
          <div class="gallery__track" tabindex="0" aria-live="polite"></div>
          <button type="button" class="gallery__arrow gallery__arrow--prev" aria-label="Photo précédente"></button>
          <button type="button" class="gallery__arrow gallery__arrow--next" aria-label="Photo suivante"></button>
          <span class="gallery__counter" aria-hidden="true"></span>
        </div>
        <div class="gallery__thumbs" role="tablist" aria-label="Miniatures"></div>
      </div>
        <div class="buybox" id="buybox">
          <p class="buybox__vendor" data-brand>Cozy Dragon</p>
          <h1 class="buybox__title buybox__title--lg" id="sp-name">Chaussons Cozy Dragon assortis™</h1>
          <div class="price-row price-row--lg" aria-label="Prix">
            <span class="price__now" id="sp-price"></span>
            <s class="price__was" id="sp-compare" hidden></s>
          </div>
          <p class="buybox__desc" id="sp-desc"></p>

          <div class="option" id="sp-size-option">
            <p class="option__label" id="sp-size-label">Taille <span class="option__value" id="sp-size-hint"></span></p>
            <div class="pills pills--row" id="sp-sizes" role="radiogroup" aria-labelledby="sp-size-label"></div>
            <p class="inline-note" id="sp-size-guide" hidden></p>
          </div>
          <div class="option">
            <p class="option__label">Quantité</p>
            <div id="sp-qty"></div>
          </div>

          <div class="buybox__actions">
            <button type="button" class="btn btn--black btn--cta btn--full" id="cta">Ajouter au panier</button>
          </div>

          <ul class="bullets" id="sp-bullets" aria-label="Points forts"></ul>
          <div class="acc" id="sp-acc"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Pied de page -->
  <footer class="footer">
    <div class="container">
      <h2 class="footer__heading">Conditions et politiques</h2>
      <nav class="footer__links" aria-label="Conditions et politiques" data-footer-links>
        <a href="./politique-de-confidentialite.html">Politique de confidentialité</a>
        <a href="./mentions-legales.html">Mentions légales</a>
        <a href="./cgv.html">CGV</a>
        <a href="./retours.html">Retours</a>
        <a href="#cookies" data-cookie-prefs>Préférences cookies</a>
      </nav>
      <div class="footer__bottom">
        <div class="payments" data-payments aria-label="Moyens de paiement acceptés"></div>
        <p class="footer__copy">© <span data-year>2026</span> <span data-brand>Cozy Dragon</span></p>
      </div>
    </div>
  </footer>

  <!-- Bouton d'achat flottant (desktop) / barre fixe (mobile) -->
  <div class="sticky-bar" id="sticky-bar" aria-hidden="true">
    <div class="sticky-bar__info"><strong id="sticky-price"></strong><small id="sticky-label"></small></div>
    <button type="button" class="btn sticky-bar__btn" id="sticky-cta">Ajouter au panier</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
