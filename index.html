<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique</title>
  <meta name="description" content="">
  <meta property="og:type" content="product">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="./" data-brand>Boutique</a>
      <a id="instagram-link" class="header__ig" href="#" target="_blank" rel="noopener" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
        <span>Instagram</span>
      </a>
    </div>
  </header>

  <main class="container" id="main">
    <p id="load-error" class="notice" hidden></p>

    <section class="hero">
      <div class="gallery">
        <img id="main-image" class="gallery__main" src="" alt="">
        <div id="thumbs" class="gallery__thumbs"></div>
      </div>

      <div class="hero__info">
        <h1 id="product-name" class="hero__title"></h1>
        <p id="product-tagline" class="hero__tagline"></p>

        <div class="price">
          <span id="price" class="price__current"></span>
          <s id="compare-at" class="price__compare" hidden></s>
          <span id="discount" class="price__badge" hidden></span>
        </div>

        <a id="buy-btn" class="btn btn--primary btn--lg" href="#">Acheter maintenant</a>
        <p id="shipping-note" class="hero__shipping"></p>

        <ul id="bullets" class="bullets"></ul>
      </div>
    </section>

    <section class="section">
      <h2>Description</h2>
      <p id="product-description" class="description"></p>
    </section>

    <section class="reassurance" aria-label="Garanties">
      <div class="reassurance__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <div><strong>Paiement sécurisé</strong><span>par Stripe</span></div>
      </div>
      <div class="reassurance__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <div><strong>Livraison suivie</strong><span>numéro de suivi par e-mail</span></div>
      </div>
      <div class="reassurance__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <div><strong>Retours 14 jours</strong><span>satisfait ou remboursé</span></div>
      </div>
    </section>

    <section class="section">
      <h2>Questions fréquentes</h2>
      <div id="faq" class="faq"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© <span data-year></span> <span data-brand></span></p>
      <nav class="footer__links">
        <a href="./mentions-legales.html">Mentions légales</a>
        <a href="./cgv.html">CGV</a>
        <a href="#" data-email-link>Contact</a>
      </nav>
    </div>
  </footer>

  <div id="sticky-bar" class="sticky-bar" aria-hidden="true">
    <div class="sticky-bar__price">
      <span id="sticky-price"></span>
      <small data-brand></small>
    </div>
    <a id="sticky-buy" class="btn btn--primary" href="#">Acheter</a>
  </div>

  <script src="./app.js"></script>
</body>
</html>
